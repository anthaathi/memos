name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A fine-grained PAT makes release-please tags trigger release.yml (the
      # default GITHUB_TOKEN does not). Forks without the secret skip this
      # automation; cutting a release then means pushing a vX.Y.Z tag by hand.
      - name: Check release token
        id: token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is not set; skipping release-please automation." >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-please
        if: steps.token.outputs.available == 'true'
        uses: googleapis/release-please-action@v4
        with:
          # Use a fine-grained PAT so generated tags trigger release.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
